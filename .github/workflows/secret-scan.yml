name: Secret Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'refactor/**'
    # NOTE: runtime/data is intentionally NOT excluded — credentials live there.
    # Only ignore binary databases (which gitleaks would mis-scan as text).
    paths-ignore:
      - '*.sqlite'
      - '*.sqlite-wal'
      - '*.sqlite-shm'
  pull_request:
    branches:
      - main
      - develop

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

