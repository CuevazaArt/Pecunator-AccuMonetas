name: Secret Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'refactor/**'
      - 'copilot/**'
      - 'feature/**'
    # Scan all text files for leaked secrets, including runtime/data/.
    # Exclude only binary files and generated SQLite WAL files.
    paths-ignore:
      - '*.sqlite'
      - '*.sqlite-wal'
      - '*.sqlite-shm'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - 'venv/**'
      - '.venv/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

