name: "CI Gate — Required for merge to main"

# This workflow is the SINGLE required status check for branch protection.
# Flutter UI has been deprecated — only Python checks remain.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-lint:
    name: "Python Lint & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (errors only)
        run: ruff check runtime/ cli/

      - name: Pytest (core + e2e modules)
        run: |
          pytest runtime/tests/ tests/ -v --tb=short -x

  gate:
    name: "CI Gate"
    needs: [python-lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.python-lint.result }}" != "success" ]; then
            echo "❌ Python lint/tests failed"
            exit 1
          fi
          echo "✅ All CI checks passed — merge allowed"
